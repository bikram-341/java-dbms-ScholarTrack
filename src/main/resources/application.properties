# ===================================================================
# SCHOLARTRACK - SCHOLARSHIP APPLICATION & ELIGIBILITY TRACKER
# Main Spring Boot Configuration
# ===================================================================

spring.application.name=scholartrack-backend
server.port=8080

# Default to In-Memory H2 with MySQL syntax mode (seamless out-of-the-box run)
# Can be overridden via environment variables or application-mysql.properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:scholartrack_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# SQL Seed Initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# H2 Database Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Token Security Settings
app.jwt.secret=9a38df4f5d2b8612d46e91f1a5f4d89326e11894d872b2195f1e8a93e3b7c8d9
app.jwt.expiration-ms=86400000

# OpenAPI / Swagger Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Logging Configuration
logging.level.com.scholartrack=DEBUG
logging.level.org.springframework.security=INFO
